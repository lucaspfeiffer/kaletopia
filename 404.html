<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Kaletopia</title>
  <script>
    // Newsletter posts lived at kaletopia.com/p/... before the site moved here.
    // Forward them to the newsletter's new home so shared links keep working.
    (function () {
      var p = location.pathname;
      if (/^\/(p|archive|subscribe)(\/|$)/.test(p) && location.hostname.endsWith('kaletopia.com')) {
        location.replace('https://blog.kaletopia.com' + p + location.search);
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: Georgia, serif; color: #121212; background: #fff; text-align: center; padding: 1rem; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; }
    p { color: #5a5a5a; margin: 0; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div>
    <h1>Not found</h1>
    <p>There is no entry at this address. <a id="home" href="/">Back to the front page.</a></p>
  </div>
  <script>
    // On GitHub Pages the site lives under /kaletopia/ until the domain moves.
    if (location.hostname.endsWith('github.io')) document.getElementById('home').href = '/kaletopia/';
  </script>
</body>
</html>
